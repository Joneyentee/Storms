[build]
  publish = "dist"
  command = "npm install && npm run build"

# Persists the summary cache between deploys so only changed notes are
# re-summarised (see src/helpers/generateSummaries.js).
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [".cache"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

